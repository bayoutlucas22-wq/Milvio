<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artifact Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>
<body>
  <div class="top-nav">
    <div class="brand">App-Milvio Dashboard</div>
    <div class="tabs">
      <button class="tab-btn active" data-target="artifacts-view">Artifacts</button>
      <button class="tab-btn" data-target="knowledge-view">App-Milvio Knowledge</button>
    </div>
  </div>

  <!-- Artifacts View -->
  <div class="app-container tab-view active" id="artifacts-view">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Artifacts</h2>
      </div>
      <div class="file-list" id="file-list">
        <!-- File items injected here by app.js -->
        <div class="loading">Loading files...</div>
      </div>
    </aside>
    <main class="content-area">
      <header class="content-header">
        <h1 id="current-file-name">Select an artifact to view</h1>
      </header>
      <div class="content-body" id="content-body">
        <div class="empty-state">
          <p>No artifact selected. Please choose one from the sidebar.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- App-Milvio Knowledge View -->
  <div class="app-container tab-view" id="knowledge-view">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Swagger Domains</h2>
      </div>
      <div class="file-list" id="knowledge-list">
        <div class="loading">Loading knowledge...</div>
      </div>
    </aside>
    <main class="content-area">
      <header class="content-header">
        <h1 id="knowledge-title">Select a domain to view</h1>
      </header>
      <div class="content-body knowledge-body" id="knowledge-body">
        <div class="empty-state">
          <p>No domain selected.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
