name: app-milvio

services:
  api:
    build:
      context: ./backend
    environment:
      ANALYTICS_PATH: /data/artifacts/analytics.json
      SWAGGER_KNOWLEDGE_PATH: /data/artifacts/swagger_knowledge.json
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/data/artifacts:ro
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NODE_ENV: development
      VITE_API_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      mongo:
        condition: service_started
      redis:
        condition: service_started

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  frontend_node_modules:
  redis_data:
